<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 420" width="1030" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>개발 로드맵: 4단계, 관문 3개</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1030" height="420" fill="#ffffff"/>

  <!-- stage 1 -->
  <rect x="30" y="40" width="190" height="190" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="125" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#0284c7">1단계</text>
  <text x="125" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">뼈대</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="125" y="130">Vite + TypeScript 세팅</text>
    <text x="125" y="154">data/*.json 스키마</text>
    <text x="125" y="178">엔진: 턴·승률·이벤트</text>
    <text x="125" y="202">Vitest·시뮬레이션</text>
  </g>
  <!-- stage 2 -->
  <rect x="290" y="40" width="190" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="385" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">2단계</text>
  <text x="385" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">MVP</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="385" y="130">FPS·AOS 2장르</text>
    <text x="385" y="154">6개월 단위 튜토리얼</text>
    <text x="385" y="178">능력치 뽑기(가챠)</text>
    <text x="385" y="202">엔딩 8종·자동 저장</text>
  </g>
  <!-- stage 3 -->
  <rect x="550" y="40" width="190" height="190" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="645" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">3단계</text>
  <text x="645" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">완성도</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="645" y="130">외형 꾸미기·상점</text>
    <text x="645" y="154">도트 에셋 (방 5장)</text>
    <text x="645" y="178">정보 페이지 6개</text>
    <text x="645" y="202">결과 카드·애드센스</text>
  </g>
  <!-- stage 4 -->
  <rect x="810" y="40" width="190" height="190" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="905" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#db2777">4단계</text>
  <text x="905" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">확장</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="905" y="130">RTS·격투 장르 추가</text>
    <text x="905" y="154">3개월·1개월 모드</text>
    <text x="905" y="178">업적·도감 확대</text>
    <text x="905" y="202">온라인 랭킹</text>
  </g>

  <!-- arrows through gates -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M220 135 H233"/>
    <path d="M277 135 H288" marker-end="url(#a)"/>
    <path d="M480 135 H493"/>
    <path d="M537 135 H548" marker-end="url(#a)"/>
    <path d="M740 135 H753"/>
    <path d="M797 135 H808" marker-end="url(#a)"/>
  </g>
  <!-- gates -->
  <g fill="#f1f5f9" stroke="#475569" stroke-width="1.5">
    <polygon points="255,113 277,135 255,157 233,135"/>
    <polygon points="515,113 537,135 515,157 493,135"/>
    <polygon points="775,113 797,135 775,157 753,135"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="255" y="140">1</text>
    <text x="515" y="140">2</text>
    <text x="775" y="140">3</text>
  </g>

  <!-- gate legend -->
  <text x="30" y="285" font-size="14" font-weight="700" fill="#0f172a">관문 (통과해야 다음 단계로)</text>
  <g font-size="13" fill="#334155">
    <polygon points="40,303 52,315 40,327 28,315" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1</text>
    <text x="64" y="320">시뮬레이션에서 실력치 R 곡선이 기획서 §7 수치와 비슷하게 나온다</text>

    <polygon points="40,343 52,355 40,367 28,355" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2</text>
    <text x="64" y="360">처음부터 엔딩까지 한 판이 15~25분에 완주된다 (직접 플레이)</text>

    <polygon points="40,383 52,395 40,407 28,395" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="399" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3</text>
    <text x="64" y="400">정보 페이지와 읽을 거리를 갖춰 애드센스 심사를 신청할 수 있다</text>
  </g>
</svg>
