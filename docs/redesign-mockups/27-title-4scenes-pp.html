<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타이틀 4장면 슬라이드 시안 (새 이미지)</title>
<style>
  :root { --cycle: 16s; }
  body { margin: 0; background: #f3f5f9; color: #222; font-family: system-ui, "Pretendard", sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 20px 0; }
  main { width: min(var(--w, 760px), 94vw); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 14px; color: #3b82f6; font-weight: 700; margin: 0 0 14px; }
  .toolbar { display: flex; gap: 8px; justify-content: center; margin: 0 0 12px; }
  .toolbar button { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .hi-frame { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 16px; background: #1b1b2a; box-shadow: 0 6px 20px rgba(30,40,80,.18); }
  .paused .scene, .paused .scene * { animation-play-state: paused !important; }

  .scene { position: absolute; inset: 0; opacity: 0; animation: scene var(--cycle) linear infinite; animation-delay: calc(var(--i) * 4s); transform-origin: 50% 55%; }
  .scene > img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  @keyframes scene { 0% { opacity: 0; transform: scale(1); } 3% { opacity: 1; } 25% { opacity: 1; transform: scale(1.07); } 29% { opacity: 0; transform: scale(1.07); } 100% { opacity: 0; transform: scale(1); } }

  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 10px; background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff; font-weight: 800; font-size: clamp(12px, 2.6vw, 17px); text-shadow: 0 1px 3px rgba(0,0,0,.6); opacity: 0; animation: capk var(--cycle) linear infinite; animation-delay: calc(var(--i) * 4s); }
  @keyframes capk { 0% { opacity: 0; } 3% { opacity: 1; } 25% { opacity: 1; } 29% { opacity: 0; } 100% { opacity: 0; } }
  .dots { position: absolute; top: 8px; right: 10px; display: flex; gap: 4px; z-index: 5; }
  .dots i { width: 14px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); animation: dk var(--cycle) linear infinite; animation-delay: calc(var(--i) * 4s); }
  @keyframes dk { 0% { background: #fff; } 25% { background: #fff; } 26% { background: rgba(255,255,255,.35); } 100% { background: rgba(255,255,255,.35); } }

  /* 공통 효과 */
  .sp { position: absolute; width: 1%; aspect-ratio: 1; background: #fff6b0; animation: tw 1.6s steps(2) infinite; }
  .sp::before, .sp::after { content: ""; position: absolute; background: inherit; }
  .sp::before { left: -100%; right: -100%; top: 33%; bottom: 33%; }
  .sp::after { top: -100%; bottom: -100%; left: 33%; right: 33%; }
  @keyframes tw { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .blink { position: absolute; animation: bl .6s steps(1) infinite; }
  @keyframes bl { 50% { opacity: .15; } }

  /* 1 방구석 */
  #screen1 { position: absolute; left: 14.2%; top: 45.5%; width: 12.8%; height: 22%; image-rendering: pixelated; mix-blend-mode: multiply; }
  .head1 { position: absolute; left: 26%; top: 33%; width: 19.5%; height: 26.5%; background: url(title-pp-rom-1-room.jpg) 32.3% 44.9% / 512.8% 377.4% no-repeat; image-rendering: pixelated; animation: nod 1.2s steps(1) infinite; }
  @keyframes nod { 0% { transform: translateY(0); } 25% { transform: translateY(.5%); } 50% { transform: translate(-.25%,.3%); } 75% { transform: translate(.25%,.5%); } }
  .steam { position: absolute; width: .9%; aspect-ratio: 1; background: rgba(255,255,255,.8); opacity: 0; animation: st 2s steps(8) infinite; }
  @keyframes st { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(6px,-30px); } }
  .z { position: absolute; font: 700 clamp(9px, 2.2vw, 18px)/1 monospace; color: #fff; text-shadow: 1px 1px 0 #7a3a10, -1px -1px 0 #7a3a10, 1px -1px 0 #7a3a10, -1px 1px 0 #7a3a10; opacity: 0; animation: zz 3.6s steps(9) infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(12px,-30px); } }
  .emo { position: absolute; left: 33%; top: 22%; font: 800 clamp(13px, 3vw, 26px)/1 monospace; color: #fff; text-shadow: 2px 2px 0 #c2410c, -2px -2px 0 #c2410c, 2px -2px 0 #c2410c, -2px 2px 0 #c2410c; opacity: 0; animation: emo 6s steps(1) infinite; }
  @keyframes emo { 0%,3% { opacity: 0; } 4%,12% { opacity: 1; transform: translateY(-4px); } 13%,100% { opacity: 0; } }
  .bulb { position: absolute; width: 1.8%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#fff7c2, rgba(255,230,120,0) 70%); mix-blend-mode: screen; animation: bulb 1.8s steps(2) infinite; }
  @keyframes bulb { 50% { opacity: .35; } }
  .mglow { position: absolute; left: 8%; top: 38%; width: 28%; height: 36%; background: radial-gradient(closest-side, rgba(120,240,255,.28), transparent); mix-blend-mode: screen; animation: pulse 2.4s steps(6) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 2 훈련 */
  .strip { position: absolute; left: 0; right: 0; top: 66%; height: 22%; background: linear-gradient(rgba(255,240,170,0), rgba(255,240,170,.28), rgba(255,240,170,0)); mix-blend-mode: screen; animation: flick 1.4s steps(1) infinite; }
  @keyframes flick { 0% { opacity: 1; } 30% { opacity: .45; } 55% { opacity: .9; } 80% { opacity: .5; } }
  .sweep { position: absolute; left: 21.8%; top: 16%; width: 25%; height: 40.5%; overflow: hidden; mix-blend-mode: screen; }
  .sweep::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: sw 3s linear infinite; }
  @keyframes sw { to { left: 130%; } }
  .rays { position: absolute; right: 0; top: 0; width: 42%; height: 62%; background: linear-gradient(115deg, transparent 30%, rgba(255,230,150,.22) 50%, transparent 70%); mix-blend-mode: screen; animation: pulse 3s steps(8) infinite; }

  /* 3 대회 */
  .beam { position: absolute; top: -10%; width: 22%; height: 80%; mix-blend-mode: screen; opacity: .55; transform-origin: 50% 0; animation: sway 3.2s ease-in-out infinite alternate; }
  .beam.l { left: 6%; background: linear-gradient(180deg, rgba(255,200,90,.85), transparent 75%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
  .beam.r { right: 6%; background: linear-gradient(180deg, rgba(120,200,255,.85), transparent 75%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); animation-delay: -1.6s; }
  @keyframes sway { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .unit { position: absolute; width: 1.1%; aspect-ratio: 1; box-shadow: 0 0 0 1px rgba(0,0,0,.4); animation: wander 2.4s steps(6) infinite alternate; }
  @keyframes wander { to { transform: translate(var(--dx), var(--dy)); } }
  .stick { position: absolute; width: .9%; height: 5.5%; border-radius: 2px; mix-blend-mode: screen; transform-origin: 50% 100%; animation: wave 1.1s steps(3) infinite alternate; }
  @keyframes wave { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  .key { position: absolute; width: 1.4%; height: .9%; background: #aef; mix-blend-mode: screen; animation: bl .35s steps(1) infinite; }

  /* 4 우승 */
  .fw { position: absolute; width: 14%; aspect-ratio: 1; margin: -7% 0 0 -7%; background: radial-gradient(circle, rgba(255,240,170,.9), rgba(255,170,60,.45) 35%, transparent 62%); mix-blend-mode: screen; animation: fw 1.6s steps(5) infinite; transform: scale(0); }
  @keyframes fw { 0% { transform: scale(.1); opacity: 1; } 80% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.1); opacity: 0; } }
  .cf { position: absolute; top: -4%; width: 1.1%; height: 1.7%; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate(var(--dx), 118vh) rotate(var(--rot)); } }
  .shine { position: absolute; left: 36%; top: 6%; width: 28%; height: 36%; background: radial-gradient(closest-side, rgba(255,255,220,.55), transparent); mix-blend-mode: screen; animation: pulse 1.4s steps(5) infinite; }
  .arm { position: absolute; left: 35%; top: 27%; }
  p.note { font-size: 12px; color: #667; line-height: 1.6; margin-top: 12px; }
</style>
</head>
<body>
<main id="main">
  <h1>방구석 겜돌이에서 프로게이머되기</h1>
  <p class="sub">16세, 방구석에서 월드 챔피언십 우승을 향한 15년</p>
  <div class="toolbar">
    <button id="bPause">⏸ 일시정지</button>
    <button id="bSize">📱 폰 크기로 보기</button>
  </div>
  <div class="hi-frame" id="hero">
    <div class="scene" style="--i:0" id="s1">
      <img src="title-pp-rom-1-room.jpg" alt="">
      <div class="head1"></div>
      <canvas id="screen1" width="64" height="48"></canvas>
      <div class="mglow"></div>
    </div>
    <div class="scene" style="--i:1" id="s2">
      <img src="title-pp-rom-2-train.jpg" alt="">
    </div>
    <div class="scene" style="--i:2" id="s3">
      <img src="title-pp-rom-3-match-b.jpg" alt="">
    </div>
    <div class="scene" style="--i:3" id="s4">
      <img src="title-pp-rom-4-win.jpg" alt="">
    </div>
    <div class="cap" style="--i:0">방구석에서 열심히 게임하던 겜돌이가</div>
    <div class="cap" style="--i:1">코치·팀원과 연습해서 실력을 키워</div>
    <div class="cap" style="--i:2">대회에서 다 같이 겨루고</div>
    <div class="cap" style="--i:3">월드 챔피언을 향해!</div>
    <div class="dots"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i></div>
  </div>
  <p class="note">4장면이 4초씩 16초 주기로 이어져요. 장면마다 효과가 달라요: 방구석(모니터 도트 게임·머리 까딱·전구·컵라면 김·고양이 zzz) → 훈련(모니터 깜빡임·전술판 빛 지나감·노을빛) → 대회(조명 빔·전광판 속 유닛·응원봉·키보드 불빛) → 우승(폭죽·금빛 종이·트로피 반짝).</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const add = (parent, cls, css, text) => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; if (text) d.textContent = text; parent.appendChild(d); return d; };
const rnd = (a, b) => a + Math.random() * (b - a);

// 공통 반짝이
function sparks(el, list) { list.forEach(([x, y, d]) => add(el, 'sp', `left:${x}%;top:${y}%;animation-delay:${d}s`)); }

// 1 방구석
const s1 = $('s1');
sparks(s1, [[10,22,0],[30,12,.5],[44,30,1.1],[52,52,.3],[60,18,.8],[70,40,1.3],[84,60,.6],[20,52,1.4],[90,28,.2]]);
[[3.3,15.6,0],[8.5,19.5,.4],[24.7,23.4,.8],[32.5,22.5,1.1],[39.7,18,.2],[45.2,12.7,.6]].forEach(([x,y,d]) => add(s1, 'bulb', `left:${x-.9}%;top:${y-.9}%;animation-delay:${d}s`));
[[66,68,0],[69,63,1.2],[72,58,2.4]].forEach(([x,y,d]) => add(s1, 'z', `left:${x}%;top:${y}%;animation-delay:${d}s`, 'z'));
[[92,76,0],[93.4,76,.7],[94.8,76,1.3]].forEach(([x,y,d]) => add(s1, 'steam', `left:${x}%;top:${y}%;animation-delay:${d}s`));
const emo = add(s1, 'emo', '', '!');
const emos = ['!', '♥', '★', 'GG']; let ei = 0; setInterval(() => { emo.textContent = emos[ei++ % emos.length]; }, 6000);

// 모니터 속 도트 러너
const g = $('screen1').getContext('2d'), W = 64, H = 48; let t = 0;
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
setInterval(() => {
  t++; R(0,0,W,H,'#8fd3ff'); R(0,0,W,12,'#6cc0ff');
  for (let i = 0; i < 3; i++) { const x = ((i*30 - t*.4) % (W+16) + W+16) % (W+16) - 8; R(x, 6+i*5, 10, 3, '#fff'); }
  for (let x = 0; x < W; x += 2) { const h = 7 + Math.sin((x + t*.8)/8)*3; R(x, H-14-h, 2, h+1, '#6fcf7a'); }
  R(0,H-13,W,13,'#c98a4a'); R(0,H-13,W,3,'#4cbf5a');
  for (let i = 0; i < 3; i++) { const x = ((i*24 - t*2) % (W+8) + W+8) % (W+8) - 4; R(x, H-26-(i%2)*7, 4, 4, '#ffd23a'); }
  const ox = ((50 - t*2) % (W+16) + W+16) % (W+16) - 8; R(ox, H-20, 6, 7, '#e0455a');
  const ph = t % 60, j = ph > 40 ? Math.sin((ph-40)/20*Math.PI)*12 : 0, hy = H-22-j;
  R(12, hy, 6, 5, '#3b7bff'); R(13, hy-3, 4, 3, '#ffd9b0'); R(13, hy-4, 4, 1, '#5a3418');
  const lg = Math.floor(t/3)%2; R(12+(lg?0:3), hy+5, 2, 3, '#26418f'); R(12+(lg?3:1), hy+5, 2, 3, '#26418f');
  R(2,2,18,3,'#fff'); R(3,3,12,1,'#3ec65a');
}, 90);

// 2 훈련
const s2 = $('s2');
add(s2, 'rays', ''); add(s2, 'sweep', '');
add(s2, 'strip', '');
sparks(s2, [[8,12,0],[16,38,.7],[48,8,1.2],[56,52,.4],[66,12,.9],[78,32,1.5],[90,50,.2],[40,60,1]]);

// 3 대회
const s3 = $('s3');
add(s3, 'beam l', ''); add(s3, 'beam r', '');
for (let i = 0; i < 8; i++) { const blue = i % 2 === 0; add(s3, 'unit', `left:${rnd(30,62)}%;top:${rnd(12,36)}%;background:${blue ? '#4aa8ff' : '#ff6a4a'};--dx:${rnd(-4,4)}vw;--dy:${rnd(-4,4)}vh;animation-delay:${rnd(0,2)}s`); }
[[3.9,86],[18.9,86.4],[37.1,87.9],[59.9,86.9],[74.9,88.9],[83.3,86.9]].forEach(([x,y],i) => add(s3, 'stick', `left:${x}%;top:${y-5}%;background:${i%2 ? '#8fd0ff' : '#ffb347'};animation-delay:${i*.15}s`));
[[9,77],[14,77.5],[19,77],[24,77.5],[60,77],[66,77.5],[72,77],[78,77.5],[84,77]].forEach(([x,y],i) => add(s3, 'key', `left:${x}%;top:${y}%;animation-delay:${(i%4)*.09}s`));
sparks(s3, [[6,10,0],[22,14,.6],[48,8,1.1],[72,12,.3],[90,16,.9],[40,50,1.4],[60,46,.5]]);

// 4 우승
const s4 = $('s4');
add(s4, 'shine', '');
[[13,17,0],[77,20,.5],[26,35,1],[60,12,.3],[90,42,.8]].forEach(([x,y,d]) => add(s4, 'fw', `left:${x}%;top:${y}%;animation-delay:${d}s`));
const cols = ['#ffd23a','#fff2a8','#ff8f3a','#fff','#ffb3c7','#8fd0ff'];
for (let i = 0; i < 34; i++) add(s4, 'cf', `left:${rnd(0,98)}%;background:${cols[i%cols.length]};--dx:${rnd(-4,4)}vw;--rot:${rnd(-540,540)}deg;animation-duration:${rnd(2.4,4.2)}s;animation-delay:${rnd(-4,0)}s`);
sparks(s4, [[30,14,0],[62,10,.4],[43,30,.9],[18,50,.2],[84,55,.7],[50,5,1.2]]);

// 컨트롤
const hero = $('hero'); let paused = false;
$('bPause').onclick = () => { paused = !paused; hero.classList.toggle('paused', paused); $('bPause').textContent = paused ? '▶ 재생' : '⏸ 일시정지'; };
let phone = false;
$('bSize').onclick = () => { phone = !phone; $('main').style.setProperty('--w', phone ? '360px' : '760px'); $('bSize').textContent = phone ? '🖥 크게 보기' : '📱 폰 크기로 보기'; };
</script>
</body>
</html>
